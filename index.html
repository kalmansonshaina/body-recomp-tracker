<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Body Recomp Tracker</title>
<meta name="description" content="Flexible body-recomposition tracker: strength, cardio, steps, weight, measurements, supplements and a weekly Body Recomp Score.">
<meta name="theme-color" content="#3f7bff">

<!-- iOS: make it a real home-screen app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recomp">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><!-- rendered by app.js --></div>
  <nav class="tabbar" id="tabbar"></nav>
  <div id="modal-root"></div>
  <div id="toast"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
